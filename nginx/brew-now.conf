# BrewNow Nginx reverse proxy config
#
# Usage:
# 1) Build frontend: cd frontend && npm run build
# 2) Place this file in your nginx site config directory.
# 3) Adjust `root` to your actual frontend dist directory.
#
# Notes:
# - Backend runs at http://127.0.0.1:8080 with context-path /api
# - Optional MinIO proxy is exposed at /minio/

upstream brewnow_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream brewnow_minio {
    server 127.0.0.1:9000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # IMPORTANT: change this path to your actual frontend dist path.
    root /opt/brew-now/frontend/dist;
    index index.html;

    charset utf-8;
    client_max_body_size 20m;

    # Frontend SPA routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to Spring Boot backend (/api/**).
    location /api/ {
        proxy_pass http://brewnow_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Optional: expose MinIO through nginx as /minio/**
    # If enabled, set backend env:
    #   MINIO_PUBLIC_ENDPOINT=http://<your-domain>/minio
    location /minio/ {
        rewrite ^/minio/(.*)$ /$1 break;
        proxy_pass http://brewnow_minio;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Quick health check endpoint for nginx itself.
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
